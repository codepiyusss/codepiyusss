name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *" # Run every day at 03:00 UTC
  push:
    paths:
      - ".github/workflows/streak-stats.yml" # Run any time this workflow file is modified
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      
      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=dark&background=000E1B&border=FF6300&stroke=FF6300&ring=FF6300&fire=FF3D00&currStreakNum=FFE9DA&sideNums=FF6300&sideLabels=FFE9DA&dates=FFE9DA&locale=en
          path: profile/streak.svg
          
      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats with custom theme" || exit 0
          git push
