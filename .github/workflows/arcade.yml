name: Generate arcade animation

on:
  schedule: # every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

concurrency:
  group: arcade
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Generate snake-contribution-graph.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_snake.py --user "${{ github.repository_owner }}" --output dist/snake-contribution-graph.svg

      - name: Push snake-contribution-graph.svg to the output branch
        run: bash scripts/publish_output.sh dist/snake-contribution-graph.svg snake-output
